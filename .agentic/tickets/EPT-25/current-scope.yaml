ticket: EPT-25
risk: MEDIUM
branch: feature/EPT-25

acceptance_criteria:
  - id: AC-001
    text: "Customer can search policies by policy number (partial match) in My Policies; Policies catalog searches by title (confirmed at Gate 1 -- no policy_number field exists on catalog Policy rows)"
  - id: AC-002
    text: "Customer can filter by policy status and policy type in My Policies; Policies catalog supports type filter only (confirmed at Gate 1 -- no status field exists on catalog Policy rows)"
  - id: AC-003
    text: "Search and multiple filters can be applied together; results match search AND all selected filters, each evaluated independently against the full list"
  - id: AC-004
    text: "Results contain only policies matching the criteria and applicable to the active tab; no cross-tab data leakage; state resets on tab navigation"
  - id: AC-005
    text: "A distinct empty state (with a Clear button) appears when search/filters match nothing, separate from the existing zero-data empty state"
  - id: AC-006
    text: "Clearing search and filters restores the complete policy list for the active tab"
  - id: AC-007
    text: "Search and filter controls are neatly aligned, consistently spaced, and visually integrated with the existing UI on both tabs"

