# Scope contract for EPT-13 - Policy Endorsement: Customer-Requested Vehicle Updates
# Generated by the planner (Phase 3). Part of what the human approves at Gate 1.

ticket: EPT-13
risk: HIGH   # schema changes + authorization-sensitive approval workflow - see plan.md "Risk"
branch: feature/EPT-13

acceptance_criteria:
  - id: AC-001
    text: "A customer can submit a vehicle detail update for their own ACTIVE policy; a new endorsement is created."
  - id: AC-002
    text: "Invalid vehicle information is rejected with a clear validation error and NO endorsement is created."
  - id: AC-003
    text: "A customer cannot submit an endorsement against a policy they do not own - the attempt is blocked (403)."
  - id: AC-004
    text: "Submitting an update creates an endorsement with status=Pending, snapshots old_values, and does NOT change the live vehicle details."
  - id: AC-005
    text: "After an admin approves, the vehicle row reflects the new details and the endorsement status becomes Approved with a decision date."
  - id: AC-006
    text: "The customer can view endorsement history for a policy showing old values, new values, request date and status for each change."
  - id: AC-007
    text: "After an admin rejects, the vehicle details remain unchanged and the endorsement status becomes Rejected with a decision date."
  - id: AC-008
    text: "Endorsements can only be submitted against policies in 'active' status (expired/cancelled/pending are rejected)."
  - id: AC-009
    text: "Approving/rejecting an endorsement is admin-only; non-admin callers get 403. Only Pending endorsements are decidable."
  - id: AC-010
    text: "Multiple Pending endorsements for the same policy are allowed (no conflict error at submit time)."

allowed_paths:
  - backend/models.py
  - backend/schemas.py
  - backend/main.py
  - backend/requirements.txt
  - backend/routers/endorsements.py
  - backend/routers/admin.py
  - backend/vehicle_validation.py
  - backend/tests/**
  - backend/conftest.py
  - backend/pytest.ini
  - database/init.sql
  - database/vehicles_schema.sql
  - database/endorsements_schema.sql
  - database/migrations/**
  - frontend/src/App.js
  - frontend/src/pages/Policies.js
  - frontend/src/pages/AdminEndorsements.js
  - frontend/src/pages/AdminEndorsements.css
  - frontend/src/components/Sidebar.js
  - frontend/src/components/VehicleEndorsementModal.js
  - frontend/src/components/EndorsementHistory.js
  - frontend/src/components/EndorsementHistory.css
  - frontend/src/components/FileClaimModal.css
  - frontend/src/utils/validation.js
  - frontend/src/**/*.test.js
  - .agentic/tickets/EPT-13/**
  - plan.md
  - test-plan.md

forbidden_operations:
  - deploy
  - migration          # no migration TOOL run; schema ships as reviewed .sql applied by a human
  # dependency_install intentionally NOT forbidden: Q4 approved standing up the pytest
  # harness in this ticket (pytest, httpx added to backend/requirements.txt). Risk tier
  # is already HIGH; no other new runtime deps.

frozen_tests:      # populated by the RED step (2026-09-09) — off limits, guard-frozen-tests.sh
  - backend/tests/test_endorsement_submit.py
  - backend/tests/test_endorsement_validation.py
  - backend/tests/test_endorsement_authz.py
  - backend/tests/test_endorsement_policy_state.py
  - backend/tests/test_endorsement_approve.py
  - backend/tests/test_endorsement_reject.py
  - backend/tests/test_endorsement_history.py
  - backend/tests/test_migration.py
  - frontend/src/components/VehicleEndorsementModal.test.js
  - frontend/src/components/EndorsementHistory.test.js
  - frontend/src/pages/Policies.endorsement.test.js
  - frontend/src/pages/AdminEndorsements.test.js

verification:
  build: required            # frontend: npm --prefix frontend run build
  lint: required             # backend: pylint $(git ls-files 'backend/*.py')
  type_check: optional       # no type checker configured in this repo (CRA JS, no mypy)
  unit_tests: required       # pytest backend/tests + react-scripts test (frontend)
  integration_tests: required
  api_tests: required        # new endpoints - pytest + httpx against the FastAPI app
  ui_tests: required         # customer update modal + history view + admin endorsements screen are new UI
  migration_up: required     # apply database/vehicles_schema.sql + database/endorsements_schema.sql
  migration_down: required   # database/migrations/EPT-13_down.sql drops both tables

completion:
  all_required_tests_pass: true
  scope_check_passes: true
  every_ac_has_a_passing_tc: true
