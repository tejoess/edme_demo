services:
  db:
    image: postgres:16
    container_name: ipm_db_demo
    restart: unless-stopped
    environment:
      POSTGRES_USER: covermate
      POSTGRES_PASSWORD: covermate
      POSTGRES_DB: insurance_db
    ports:
      - "5435:5432"
    volumes:
      - ipm_pgdata_demo:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  ipm_pgdata_demo:
